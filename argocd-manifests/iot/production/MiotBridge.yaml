apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-iot-miot-bridge-production
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/radoslavirha/home-server.git
      targetRevision: HEAD
      path: helm-charts/iot-applications
      helm:
        releaseName: api-iot-miot-bridge
        valueFiles:
          - $values/helm-values/iot/miot-bridge.yaml
          - $values/helm-values/iot/production/miot-bridge.yaml
          - $values/helm-values/iot/production/variables.yaml
    - repoURL: https://github.com/radoslavirha/home-server.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/radoslavirha/home-server.git
      targetRevision: HEAD
      path: k8s-manifests/iot/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      selfHeal: true
      prune: true
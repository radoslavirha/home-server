apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-iot-miot-bridge-sandbox
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/radoslavirha/home-server.git
    targetRevision: HEAD
    path: helm-charts/iot-applications
    helm:
      releaseName: api-iot-miot-bridge
      valueFiles:
        - miot-bridge.yaml
        - environments/sandbox/miot-bridge.yaml
        - environments/sandbox/variables.yaml
  destination: 
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      selfHeal: true
      prune: true
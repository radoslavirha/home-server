apps:
  interactive-map-feeder:
    image:
      tag: 0.3.0
    replicas: 2
    templates:
      config:
        content: |
          {
              "serviceName": "{{ APPLICATION }}",
              "server": {
                  "httpPort": {{ CONTAINER_PORT }}
              },
              "publicURL": "{{ VAR_PROTOCOL }}://{{ COMPONENT }}.{{ VAR_PUBLIC_DOMAIN }}/{{ APPLICATION_GROUP }}/{{ APPLICATION }}"
          }

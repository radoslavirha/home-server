apps:
  interactive-map-feeder-api:
    image:
      tag: 0.5.0
    replicas: 2
    templates:
      config:
        content: |
          {
              "serviceName": "{{ APPLICATION }}",
              "server": {
                  "httpPort": {{ CONTAINER_PORT }}
              },
              "publicURL": "{{ VAR_PROTOCOL }}://{{ COMPONENT }}.{{ VAR_PUBLIC_DOMAIN }}/{{ APPLICATION_GROUP }}/{{ PATH_NAME }}",
              "logger": {
                  "enabled": true,
                  "level": "info"
              },
              {
                "otel": {
                  "metrics": {
                    "enabled": true,
                    "exporter": {
                      "url": "http://otel-collector-production:4318/v1/metrics"
                    }
                  },
                  "traces": {
                    "enabled": true,
                    "exporter": {
                      "url": "http://otel-collector-production:4318/v1/traces"
                    }
                  },
                  "logs": {
                    "enabled": true,
                    "exporter": {
                      "url": "http://otel-collector-production:4318/v1/logs"
                    }
                  }
                }
              }
          }

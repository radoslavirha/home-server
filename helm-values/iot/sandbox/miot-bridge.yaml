apps:
  miot-bridge:
    udpIngress:
      entrypoint: udp-miot-sbx
    image:
      tag: 0.2.6
    replicas: 1
    templates:
      config:
        content: |
          {
              "serviceName": "{{ APPLICATION }}",
              "server": {
                  "httpPort": "{{ CONTAINER_PORT }}"
              },
              "publicURL": "{{ VAR_PROTOCOL }}://{{ VAR_SUBDOMAIN }}.{{ COMPONENT }}.{{ VAR_PUBLIC_DOMAIN }}/{{ APPLICATION_GROUP }}/{{ APPLICATION }}",
              "cachePath": "./cache",
              "udp": {
                  "enabled": true,
                  "port": {{ CONTAINER_UDP_PORT }}
              },
              "polling": {
                  "enabled": true,
                  "intervalMs": 5000,
                  "dispatchOnChange": true,
                  "maxErrorCount": 3,
                  "errorSkipCycles": 20
              },
              "notifications": {
                  "udp": {
                      "enabled": true,
                      "address": "192.168.1.140:50450"
                  },
                  "http": {
                      "enabled": false,
                      "address": ""
                  },
                  "mqtt": {
                      "enabled": false
                  }
              }
          }

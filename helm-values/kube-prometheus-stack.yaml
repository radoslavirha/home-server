grafana:
  admin:
    existingSecret: kube-prometheus-stack-grafana-auth-admin
    userKey: admin-user
    passwordKey: admin-password
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
        - grafana.server.home
      parentRefs:
        - name: traefik-gateway
          namespace: traefik

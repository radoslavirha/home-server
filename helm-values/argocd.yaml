global:
  domain: argocd.server.home

notifications:
  argocdUrl: http://argocd.server.home

configs:
  cm:
    url: http://argocd.server.home
  params:
    server.insecure: true

server:
  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        group: gateway.networking.k8s.io
        kind: Gateway
    hostnames:
      - argocd.server.home
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
  grpcroute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        group: gateway.networking.k8s.io
        kind: Gateway
    hostnames:
      - grpc.argocd.server.home
    rules:
      - matches:
          - headers:
              - name: Content-Type
                type: RegularExpression
                value: "^application/grpc.*$"
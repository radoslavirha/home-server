hostNetwork: true
ports:
  web:
    port: 80
  metrics: null
  udp-miot-bridge-production:
    port: 4000
    protocol: UDP
  udp-miot-bridge-sandbox:
    port: 4001
    protocol: UDP

api:
  dashboard: true
  insecure: true

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.server.home`)
    entryPoints:
      - web

service:
  externalIPs:
    - 192.168.0.200

# We will route with Gateway API instead.
ingressClass:
  enabled: false

# Enable Gateway API Provider & Disables the KubernetesIngress provider
# Providers tell Traefik where to find routing configuration.
providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
    # Watch all namespaces so Middleware CRDs in sandbox/production are found
    # when referenced via HTTPRoute ExtensionRef (@kubernetescrd).
    namespaces: []
  kubernetesGateway:
    enabled: true

## Gateway Listeners
gateway:
  listeners:
    web:           # HTTP listener that matches entryPoint `web`
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All

# Enable Observability
logs:
  general:
    level: INFO
  # This enables access logs, outputting them to Traefik's standard output by default. The [Access Logs Documentation](https://doc.traefik.io/traefik/observability/access-logs/) covers formatting, filtering, and output options.
  access:
    enabled: true

# Enables Prometheus for Metrics
metrics:
  prometheus: null
  otlp:
    enabled: false


securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
hostNetwork: true

# Required when hostNetwork: true so CoreDNS is still used for *.svc.cluster.local
# Without this, the host's DNS resolver is used and cluster DNS names don't resolve.
deployment:
  dnsPolicy: ClusterFirstWithHostNet

updateStrategy:
  type: Recreate

ports:
  web:
    port: 80
  udp-miot-prod:
    port: 4000
    protocol: UDP
    # hostNetwork: true — traffic goes directly to Traefik on the host.
    # Exposing via the Service causes kube-proxy to DNAT+SNAT packets,
    # masquerading the client source IP and breaking UDP response routing.
    expose:
      default: false
  udp-miot-sbx:
    port: 4001
    protocol: UDP
    expose:
      default: false
  mqtt:
    port: 1883
    protocol: TCP
    expose:
      default: true
  mongodb:
    port: 27017
    protocol: TCP
    expose:
      default: true
  metrics: null

api:
  dashboard: true
  insecure: true

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.server.home`)
    entryPoints:
      - web

service:
  externalIPs:
    - 192.168.0.200

# We will route with Gateway API instead.
ingressClass:
  enabled: false

# Enable Gateway API Provider & Disables the KubernetesIngress provider
# Providers tell Traefik where to find routing configuration.
providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
    # Watch all namespaces so Middleware CRDs in sandbox/production are found
    # when referenced via HTTPRoute ExtensionRef (@kubernetescrd).
    namespaces: []
  kubernetesGateway:
    enabled: true
    statusAddress:
      service:
        name: traefik
        namespace: traefik

## Gateway Listeners
gateway:
  listeners:
    web:           # HTTP listener that matches entryPoint `web`
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All

# Enable Observability
logs:
  general:
    level: INFO
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: otel-collector-opentelemetry-collector.production.svc.cluster.local:4317
        insecure: true
  # This enables access logs, outputting them to Traefik's standard output by default. The [Access Logs Documentation](https://doc.traefik.io/traefik/observability/access-logs/) covers formatting, filtering, and output options.
  access:
    enabled: true
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: otel-collector-opentelemetry-collector.production.svc.cluster.local:4317
        insecure: true

# Traces
tracing:
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: otel-collector-opentelemetry-collector.production.svc.cluster.local:4317
      insecure: true

# Metrics via OTLP
metrics:
  prometheus: null
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: otel-collector-opentelemetry-collector.production.svc.cluster.local:4317
      insecure: true

securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0

experimental:
  otlpLogs: true
apps:
  miot-bridge:
    replicas: 1
    image:
      repository: radoslavirha/miot-bridge
      tag: 0.2.4
      pullPolicy: Always
      # pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 250Mi
      limits:
        cpu: 500m
        memory: 500Mi
    labels:
      component: api
      partOf: iot
    service:
      enabled: true
      targetPort: 4000
    ingress:
      enabled: true
    templates:
      config:
        path: /home/app/config
        file: production.json